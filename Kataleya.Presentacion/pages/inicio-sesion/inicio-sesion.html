<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kataleya VIP | Inicio de sesión</title>
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="./inicio-sesion.css">
</head>
<body>
    <main class="pantalla pantalla--inicio">
        <div class="tarjeta">
            <header class="marca">
                <span class="marca__linea"></span>
                <h1 class="marca__nombre">Kataleya VIP</h1>
                <p class="marca__detalle">Reservas y venta de pasajes</p>
            </header>

            <form id="formulario-inicio" class="formulario" novalidate>
                <div class="campo">
                    <label class="campo__etiqueta" for="nombre-usuario">Nombre de usuario</label>
                    <input
                        class="campo__entrada"
                        id="nombre-usuario"
                        name="nombreUsuario"
                        type="text"
                        autocomplete="username"
                        maxlength="30"
                        aria-describedby="error-nombre-usuario"
                        required
                        autofocus>
                    <p class="campo__error" id="error-nombre-usuario"></p>
                </div>

                <div class="campo">
                    <label class="campo__etiqueta" for="contrasena">Contraseña</label>
                    <input
                        class="campo__entrada"
                        id="contrasena"
                        name="contrasena"
                        type="password"
                        autocomplete="current-password"
                        maxlength="128"
                        aria-describedby="error-contrasena aviso-bloq-mayus"
                        required>
                    <p class="campo__error" id="error-contrasena"></p>
                </div>

                <p class="aviso" id="aviso-bloq-mayus" role="status" hidden>
                    Bloq Mayús está activado.
                </p>

                <p class="mensaje" id="mensaje-inicio" role="alert" hidden></p>

                <button class="boton boton--principal" id="boton-ingresar" type="submit">
                    Ingresar
                </button>
            </form>

            <p class="pie">Agencia Kataleya VIP</p>
        </div>
    </main>

    <script type="module" src="./inicio-sesion.js"></script>
</body>
</html>
